# Install as /etc/systemd/system/salus-real-global-v2-wifi.service.d/lifecycle.conf
# The parent unit starts Docker and this checkout's WiFi launch at boot.
[Service]
# Appended after the original up-salus.sh ExecStartPre.
ExecStartPre=/usr/bin/docker exec ros2_salus python3 /ros2_ws/tools/stop_real_global_v2.py --check-stopped
# Docker exec's host process alone cannot terminate the ROS launch in Docker.
ExecStop=/usr/bin/bash -c '/usr/bin/docker exec ros2_salus python3 /ros2_ws/tools/stop_real_global_v2.py || /usr/bin/docker stop --time 10 ros2_salus'
TimeoutStopSec=60
