pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: false
    target_frame: base_footprint
    transform_tolerance: 0.1
    # En el robot real, el chasis puede cabecear/rolar algunos grados sin que
    # esa actitud aparezca en el TF plano `base_footprint -> lidar_link`.
    # Subimos aun mas la cota inferior para recortar retornos rasantes del
    # suelo en pendientes que, al proyectarse 3D -> 2D, terminan entrando como
    # obstaculos fantasma.
    min_height: 0.50
    max_height: 1.50
    angle_min: -1.57079632679
    angle_max: 1.57079632679
    angle_increment: 0.00872664626
    scan_time: 0.1
    range_min: 0.4
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
