# ================================
# BT NAVIGATOR
# ================================
# Variante WiFi: misma logica Nav2 que sim/real rolling, con menor trafico
# de costmaps/voxel debug para operacion remota.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    local_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    # 20 Hz alcanza para orquestar el BT y evita saturar CPU/red con 100 Hz.
    bt_loop_duration: 50
    # En carga, 20 ms no alcanzaban para que compute_path_to_pose confirmara
    # el goal al encadenar waypoints y NavigateToPose abortaba toda la mision.
    default_server_timeout: 200
    # Cuanto espera un nodo del arbol a que aparezca el servicio que consume,
    # AL CONSTRUIR EL ARBOL. El default de Nav2 es 1 s y no alcanza en la Jetson:
    # `IsPathClearanceValid` consume
    # /path_clearance_validator/is_path_clearance_valid, y ese nodo se lanza en
    # la misma LaunchDescription que bt_navigator -de hecho despues, en
    # nav_global_v2.launch.py-, asi que quien gana la carrera depende de cual
    # termina de inicializar primero.
    #
    # Cuando pierde, `bt_service_node.hpp` tira std::runtime_error, el XML no
    # carga, bt_navigator no configura y el lifecycle manager aborta el bringup
    # entero: la navegacion global queda muerta aunque el servicio systemd siga
    # "active". En una maquina de escritorio no se ve porque el servicio aparece
    # antes del segundo.
    #
    # No es un delay al arranque: si el servicio ya esta, wait_for_service
    # retorna de inmediato. Solo amplia la ventana para que una maquina lenta no
    # pierda la carrera.
    wait_for_service_timeout: 20000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    default_nav_to_pose_bt_xml: "REPLACED_AT_LAUNCH"
    default_nav_through_poses_bt_xml: "REPLACED_AT_LAUNCH"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_is_path_clearance_valid_condition_bt_node

path_clearance_validator:
  ros__parameters:
    use_sim_time: true
    enabled: true
    service_name: /path_clearance_validator/is_path_clearance_valid
    global_costmap_topic: /global_costmap/costmap_raw
    max_check_distance_m: 12.0
    sample_step_m: 0.25
    high_cost_threshold: 100
    lethal_cost_threshold: 253
    min_consecutive_high_cost_samples: 3
    lateral_offsets_m: [0.0, 0.45, -0.45]
    costmap_timeout_s: 4.0
    min_validation_period_s: 0.75
    slow_check_warning_s: 0.1

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    local_frame: odom
    # Tiene que coincidir con el frame del costmap local para que BackUp pueda
    # validar la marcha atras sin caer en "Pose Goes Off Grid".
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 5.0
    expansion_factor: 1.0

    behavior_plugins: [
      "backup",
      "drive_on_heading",
      "wait"
    ]

    backup:
      plugin: "nav2_behaviors/BackUp"
      simulate_ahead_time: 2.0
      stall_timeout: 3.0

    drive_on_heading:
      simulate_ahead_time: 2.0
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

    max_acceleration: 2.0
    max_deceleration: 2.0
    max_angular_acceleration: 1.0
    max_angular_deceleration: 1.0

# ================================
# WAYPOINT FOLLOWER
# ================================
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false
      waypoint_pause_duration: 0

# ================================
# PLANNER (Hybrid A*)
# ================================
planner_server:
  ros__parameters:
    use_sim_time: true
    transform_tolerance: 0.5
    planner_plugins: ["GridBased"]
    robot_base_frame: base_footprint
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      optimizer_costmap_weight: 10.0
      tolerance: 0.5
      allow_unknown: true
      max_planning_time: 6.0
      max_iterations: 3000000
      motion_model_for_search: "DUBIN"
      # Radio fisico con wheelbase=0.94m y steering_limit=30deg: ~1.63m.
      # Radio con limite automatico de direccion 18deg: ~2.89m.
      # A velocidad WiFi nominal (1.6m/s), el limite historico angular 0.4rad/s
      # equivale a 4.0m; usamos ese radio para que Smac genere curvas de calle
      # y deje margen de steering al controlador para corregir seguimiento.
      minimum_turning_radius: 4.0
      # 48 bins evita las clases angulares pares/impares que aparecian con 64.
      angle_quantization_bins: 48
      reverse_penalty: 2.8
      change_penalty: 1.8
      non_straight_penalty: 1.15
      # Penalizamos mas el costo inflado para que Smac prefiera rodeos con
      # margen lateral en vez de pasar pegado a obstaculos detectados.
      cost_penalty: 3.5
      cost_travel_multiplier: 0.8
      # Mantener paridad con sim_global_v2_wifi: esta fue la combinacion probada
      # para evitar oscilaciones/reintentos al cerrar tramos de patrulla.
      use_final_approach_orientation: false
      smooth_path: false
      debug_visualizations: false

# ================================
# PATH SMOOTHER
# ================================
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["Constrained"]
    robot_base_frame: base_footprint
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint

    Constrained:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: false
      path_downsampling_factor: 2
      path_upsampling_factor: 1
      keep_start_orientation: true
      # Mantener paridad con sim_global_v2_wifi: el planner no fuerza la
      # orientacion final, pero el smoother conserva la orientacion calculada.
      keep_goal_orientation: true
      minimum_turning_radius: 4.0
      optimizer:
        max_iterations: 80

# ================================
# CONTROLLER
# ================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    transform_tolerance: 0.3
    odom_topic: /odometry/local
    robot_base_frame: base_footprint
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      stateful: true
      xy_goal_tolerance: 1.2

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Velocidad nominal de patrulla. Las reducciones por curvatura/costo no
      # bajan de 1.2 m/s para conservar empuje en terreno irregular; las
      # reducciones criticas quedan en 0.7 m/s via aproximacion/monitor.
      desired_linear_vel: 1.6
      lookahead_dist: 3.0
      min_lookahead_dist: 2.3
      max_lookahead_dist: 4.5
      lookahead_time: 2.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.7
      approach_velocity_scaling_dist: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 1.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_rotate_to_heading: false
      allow_reversing: false
      max_angular_accel: 3.0
      transform_tolerance: 0.2
      use_interpolation: true
      max_robot_pose_search_dist: 4.0
      cost_scaling_dist: 1.2
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.3

# ================================
# LOCAL COSTMAP
# ================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      transform_tolerance: 1.0
      footprint: "[[1.05,0.38],[1.05,-0.38],[-0.12,-0.38],[-0.12,0.38]]"
      footprint_padding: 0.05
      plugins: ["voxel_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      track_unknown_space: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.4
        cost_scaling_factor: 1.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        footprint_clearing_enabled: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.60
        min_obstacle_height: 0.0
        mark_threshold: 0
        unknown_threshold: 15
        combination_method: 1
        observation_sources: scan_marking scan_clearing
        scan_marking:
          topic: /scan
          max_obstacle_height: 1.60
          min_obstacle_height: 0.0
          # Marcamos obstaculos hasta 15 m. Antes 10 m para no convertir
          # retornos bajos/rasantes del suelo lejano en obstaculos, pero con el
          # scan_ground_filter activo (/scan sale de /scan_3d/no_ground) el piso
          # se quita en 3D, asi que se puede extender el marcado sin reintroducir
          # fantasmas. raytrace_max_range queda en 20 m para limpiar espacio.
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          inf_is_valid: False
          observation_persistence: 0.6
          expected_update_rate: 0.0
          clearing: False
          marking: True
          data_type: "LaserScan"
        scan_clearing:
          topic: /scan
          max_obstacle_height: 1.60
          min_obstacle_height: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          inf_is_valid: True
          observation_persistence: 0.6
          expected_update_rate: 0.0
          clearing: True
          marking: False
          data_type: "LaserScan"
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 1.0
        override_lethal_cost: True
        lethal_override_cost: 254
      # En RViz remoto el mapa base del costmap local puede quedar latcheado con
      # un stamp viejo en `odom`, y entonces el display lo descarta al intentar
      # transformarlo hacia `map`. Forzamos mapas completos frescos para que el
      # operador vea siempre el costmap local actual.
      always_send_full_costmap: true

# ================================
# GLOBAL COSTMAP
# ================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 3.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[1.05,0.38],[1.05,-0.38],[-0.12,-0.38],[-0.12,0.38]]"
      footprint_padding: 0.05
      # Perfil real: misma ventana de 300 x 300 m, pero movil en `map`
      # para no anclar el planner a un origen fijo alrededor del datum.
      rolling_window: true
      width: 300
      height: 300
      resolution: 0.25
      transform_tolerance: 1.0
      track_unknown_space: false
      use_maximum_static_value: true
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.60
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          # Marcamos hasta 15 m. Antes 8 m por retornos bajos de suelo lejano
          # con el sensor levemente inclinado; con el scan_ground_filter activo
          # el piso se quita en 3D y se puede extender el marcado. Raytrace queda
          # en 20 m para limpiar fantasmas.
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          inf_is_valid: True
          observation_persistence: 1.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.5
        cost_scaling_factor: 1.4
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 1.0
        override_lethal_cost: True
        lethal_override_cost: 254
      always_send_full_costmap: false

# ================================
# LIFECYCLE
# ================================
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - bt_navigator
      - behavior_server
      - waypoint_follower
