# Compose ANCLADO a este repo (rutas absolutas): garantiza que el contenedor
# ros2_salus monte ROS2_SALUS sin importar desde que directorio se ejecute.
# El docker-compose.yml principal usa rutas relativas (./src, ./build, ...),
# por eso un `docker compose up` corrido desde otro workspace (p. ej. 2antenas)
# crea el MISMO contenedor montando OTRO codigo.
#
# Uso (recrear el contenedor apuntando a este repo):
#   docker rm -f ros2_salus
#   docker compose -f /home/franco/final/ROS2_SALUS/docker-compose.salus.yml up -d ros2
#   docker exec -it ros2_salus bash -lc 'cd /ros2_ws && colcon build --symlink-install'
#
# Verificacion de montajes:
#   docker inspect ros2_salus --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'

services:
  ros2:
    build:
      context: /home/franco/final/ROS2_SALUS
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: ros2-humble-perception-ws-salus
    container_name: ros2_salus
    network_mode: host
    privileged: true
    restart: unless-stopped
    group_add:
      - "20"
    volumes:
      - /home/franco/final/ROS2_SALUS/src:/ros2_ws/src
      - /home/franco/final/ROS2_SALUS/tools:/ros2_ws/tools
      - /home/franco/final/ROS2_SALUS/build:/ros2_ws/build
      - /home/franco/final/ROS2_SALUS/install:/ros2_ws/install
      - /home/franco/final/ROS2_SALUS/log:/ros2_ws/log
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/ros/.Xauthority:rw
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/ros/.Xauthority
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TURTLEBOT3_MODEL=waffle
      - GZ_SIM_RESOURCE_PATH=/opt/ros/humble/share:/home/ros/ws/install:/home/ros/ws/src
      - IGN_GAZEBO_RESOURCE_PATH=/opt/ros/humble/share:/home/ros/ws/install:/home/ros/ws/src

  netdata:
    image: netdata/netdata:stable
    container_name: netdata_salus
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
