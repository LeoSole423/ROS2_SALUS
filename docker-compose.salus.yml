# Compose anclado a este checkout: el archivo usa rutas relativas al repo
# para que funcione igual aunque `up-salus.sh` se ejecute desde otra carpeta.
#
# Uso recomendado:
#   cd ~/Desktop/SALUS/ROS2_SALUS
#   ./tools/up-salus.sh
#   ./tools/compile-ros.sh

services:
  ros2:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: ros2-humble-perception-ws-salus
    container_name: ros2_salus
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - ./src:/ros2_ws/src
      - ./tools:/ros2_ws/tools
      - ./build:/ros2_ws/build
      - ./install:/ros2_ws/install
      - ./log:/ros2_ws/log
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/ros/.Xauthority:rw
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/home/ros/.Xauthority
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - TURTLEBOT3_MODEL=waffle
      - GZ_SIM_RESOURCE_PATH=/opt/ros/humble/share:/ros2_ws/install:/ros2_ws/src
      - IGN_GAZEBO_RESOURCE_PATH=/opt/ros/humble/share:/ros2_ws/install:/ros2_ws/src
